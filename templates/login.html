{% extends "base.html" %}


{% block title %}

Login - Attendance System

{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="text-center mb-0">
                    Login
                </h3>

            </div>


            <div class="card-body">

                <form method="POST" action="{{ url_for('main.login') }}">


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
