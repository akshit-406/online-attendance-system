{% extends "base.html" %}

{% block title %}
Edit Subject
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Edit Subject</h4>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label for="subject_name" class="form-label">
                            Subject Name
                        </label>

                        <input
                            type="text"
                            name="subject_name"
                            id="subject_name"
                            class="form-control"
                            value="{{ subject.subject_name }}"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="subject_code" class="form-label">
                            Subject Code
                        </label>

                        <input
                            type="text"
                            name="subject_code"
                            id="subject_code"
                            class="form-control"
                            value="{{ subject.subject_code }}"
                            required
                        >
                    </div>


                    <div class="mb-3">
                        <label for="teacher_id" class="form-label">
                            Teacher
                        </label>

                        <select
                            name="teacher_id"
                            id="teacher_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Teacher --
                            </option>

                            {% for teacher in teachers %}

                            <option
                                value="{{ teacher.id }}"
                                {% if teacher.id == subject.teacher_id %}
                                    selected
                                {% endif %}
                            >
                                {{ teacher.name }} - {{ teacher.employee_id }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>


                    <div class="mb-3">
                        <label for="class_id" class="form-label">
                            Class
                        </label>

                        <select
                            name="class_id"
                            id="class_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Class --
                            </option>

                            {% for class_item in classes %}

                            <option
                                value="{{ class_item.id }}"
                                {% if class_item.id == subject.class_id %}
                                    selected
                                {% endif %}
                            >
                                {{ class_item.class_name }}
                                - Section {{ class_item.section }}
                            </option>

                            {% endfor %}

                        </select>
                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success"
                        >
                            Update Subject
                        </button>

                        <a
                            href="{{ url_for('main.manage_subjects') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
