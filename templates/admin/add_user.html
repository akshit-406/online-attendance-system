{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block content %}

<div class="container">

    <div class="mb-4">

        <h2>
            Add User
        </h2>

        <p class="text-muted">
            Create a new system user
        </p>

    </div>


    <div class="card shadow">

        <div class="card-header">

            <h5 class="mb-0">
                User Information
            </h5>

        </div>

        <div class="card-body">

            <form
                method="POST"
                action="{{ url_for('main.add_user') }}"
            >

                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <!-- Role -->

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Role
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                        <option value="teacher">
                            Teacher
                        </option>

                        <option value="student">
                            Student
                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create User
                </button>

                <a
                    href="{{ url_for('main.manage_users') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
