{% extends "base.html" %}

{% block title %}
Add Subject
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    Add Subject
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <!-- Subject Name -->

                    <div class="mb-3">

                        <label
                            for="subject_name"
                            class="form-label">

                            Subject Name

                        </label>

                        <input
                            type="text"
                            name="subject_name"
                            id="subject_name"
                            class="form-control"
                            placeholder="Enter subject name"
                            required
                        >

                    </div>


                    <!-- Subject Code -->

                    <div class="mb-3">

                        <label
                            for="subject_code"
                            class="form-label">

                            Subject Code

                        </label>

                        <input
                            type="text"
                            name="subject_code"
                            id="subject_code"
                            class="form-control"
                            placeholder="Enter subject code"
                            required
                        >

                    </div>


                    <!-- Teacher -->

                    <div class="mb-3">

                        <label
                            for="teacher_id"
                            class="form-label">

                            Teacher

                        </label>

                        <select
                            name="teacher_id"
                            id="teacher_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Teacher --
                            </option>

                            {% for teacher in teachers %}

                            <option value="{{ teacher.id }}">

                                {{ teacher.name }}
                                - {{ teacher.employee_id }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Class -->

                    <div class="mb-3">

                        <label
                            for="class_id"
                            class="form-label">

                            Class

                        </label>

                        <select
                            name="class_id"
                            id="class_id"
                            class="form-select"
                            required
                        >

                            <option value="">
                                -- Select Class --
                            </option>

                            {% for class_item in classes %}

                            <option value="{{ class_item.id }}">

                                {{ class_item.class_name }}
                                - Section {{ class_item.section }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Buttons -->

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            Add Subject

                        </button>

                        <a
                            href="{{ url_for('main.manage_subjects') }}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
