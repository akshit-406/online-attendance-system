{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Student</h4>
            </div>

            <div class="card-body">

                <div class="alert alert-info">
                    <strong>Login User:</strong>
                    {{ user.username }} - {{ user.email }}
                </div>

                <form method="POST"
                      action="{{ url_for('main.edit_student', student_id=student.id) }}">

                    <div class="mb-3">
                        <label class="form-label">
                            Student Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               value="{{ student.name }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Roll Number
                        </label>

                        <input type="text"
                               name="roll_no"
                               class="form-control"
                               value="{{ student.roll_no }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Class
                        </label>

                        <select name="class_id"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Class --
                            </option>

                            {% for class_item in classes %}
                                <option value="{{ class_item.id }}"
                                    {% if class_item.id == student.class_id %}
                                        selected
                                    {% endif %}>
                                    {{ class_item.class_name }}
                                    - Section {{ class_item.section }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('main.manage_students') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                            Update Student
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
