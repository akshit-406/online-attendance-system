{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add Student</h4>
            </div>

            <div class="card-body">

                <form method="POST"
                      action="{{ url_for('main.add_student') }}">

                    <div class="mb-3">
                        <label class="form-label">
                            Student Login User
                        </label>

                        <select name="user_id"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Student User --
                            </option>

                            {% for user in available_users %}
                                <option value="{{ user.id }}">
                                    {{ user.username }} - {{ user.email }}
                                </option>
                            {% endfor %}

                        </select>

                        {% if not available_users %}
                            <div class="form-text text-danger">
                                No available student login accounts.
                                Create a student user first from Manage Users.
                            </div>
                        {% endif %}
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Student Name
                        </label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter student name"
                               required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Roll Number
                        </label>

                        <input type="text"
                               name="roll_no"
                               class="form-control"
                               placeholder="Enter roll number"
                               required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Class
                        </label>

                        <select name="class_id"
                                class="form-select"
                                required>

                            <option value="">
                                -- Select Class --
                            </option>

                            {% for class_item in classes %}
                                <option value="{{ class_item.id }}">
                                    {{ class_item.class_name }}
                                    - Section {{ class_item.section }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>


                    <div class="d-flex justify-content-between">

                        <a href="{{ url_for('main.manage_students') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit"
                                class="btn btn-success">
                            Add Student
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
